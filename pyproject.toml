[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gobang"
version = "1.0.0"
description = "Gomoku (Five-in-a-Row) game with AI and LLM players - CLI, GUI, and Web interfaces"
readme = "README.md"
license = {text = "GPLv3"}
authors = [
    {name = "CodeOfMe", email = "codeofme@example.com"}
]
keywords = ["gomoku", "gobang", "five-in-a-row", "ai", "llm", "ollama", "game"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: X11 Applications :: Qt",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Games/Entertainment :: Board Games",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.9"
dependencies = [
    "PySide6>=6.5.0",
    "Flask>=3.0.0",
    "Flask-SocketIO>=5.3.0",
    "requests>=2.31.0",
    "openai>=1.0.0",
    "numpy>=1.24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[project.scripts]
gobang = "gobang.cli:main"

[project.gui-scripts]
gobang-gui = "gobang.gui:main"

[project.urls]
Homepage = "https://github.com/CodeOfMe/GoBang"
Repository = "https://github.com/CodeOfMe/GoBang"
Issues = "https://github.com/CodeOfMe/GoBang/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["gobang*"]

[tool.setuptools.package-data]
gobang = ["templates/*.html", "static/*"]

[tool.black]
line-length = 100
target-version = ["py39", "py310", "py311", "py312"]

[tool.ruff]
line-length = 100
target-version = "py39"
select = ["E", "F", "W", "I", "N", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"